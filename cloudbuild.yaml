# Cloud Build (runs as build-sa): on every push to main that touches extractor/,
# build the image, push it to Artifact Registry, then point the Cloud Run Job at it.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "extractor"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if gcloud run jobs describe ${_JOB} --region=${_REGION} >/dev/null 2>&1; then
          gcloud run jobs update ${_JOB} --region=${_REGION} --image=${_IMAGE}:${SHORT_SHA}
        else
          echo "Job ${_JOB} does not exist yet; image pushed, nothing to deploy."
        fi

substitutions:
  _REGION: us-central1
  _JOB: vuln-extractor
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/vuln-intel/vuln-extractor

options:
  logging: CLOUD_LOGGING_ONLY   # required when a trigger runs as a custom service account
  dynamicSubstitutions: true
