# Dataform project settings (Dataform reads this file from the repository root).
# extractor/ and infra/ are ignored by Dataform; it only compiles definitions/ and includes/.
defaultProject: vuln-intel-warehouse
defaultLocation: us-central1
defaultDataset: silver
defaultAssertionDataset: ops
dataformCoreVersion: 3.0.0
vars:
  # Must equal COHORT_START of the extractor (Cloud Run Job env var): the first publication day in scope.
  cohort_start: "2026-10-08"
